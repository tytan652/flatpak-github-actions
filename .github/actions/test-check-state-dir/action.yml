name: Check state directory
description: "A few checks for the test workflow"
inputs:
  state-dir:
    description: "Directory to check"
    required: true
  ccache-exist:
    description: If false, fails if it exist. If true, fails if it does not.
    default: "false"
runs:
  using: composite
  steps:
    - name: Check directory
      shell: bash
      run: |
        echo "::group::Show directory content"
        find ${{ inputs.state-dir }}
        echo "::endgroup::"

        echo "::group::Assertion tests"
        echo "::info::Check for ccache directory"
        if ${{ fromJSON(inputs.ccache-exist) && '! ' || '' }}[[ -d '${{ inputs.state-dir }}/ccache' ]]; then
          echo "::error::State directory has ${{ fromJSON(inputs.ccache-exist) && 'no' || 'a' }} ccache directory which should not be the case"
          exit 2
        fi
        echo "::endgroup::"
